name: Publish Phi5 React GitPage

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/phi5.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "phi5-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned React and Vite dependencies
        run: npm --prefix web install --no-audit --no-fund
      - name: Build Vite application for /Phi5/
        run: npm --prefix web run build
      - name: Prepare Pages artifact
        run: |
          touch web/dist/.nojekyll
          test -f web/dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
